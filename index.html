<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرفی نرم‌افزار من</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 50px 20px; }
        .box { max-width: 700px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; }
        p { line-height: 1.8; color: #cbd5e1; }
        .btn { display: inline-block; padding: 12px 25px; margin: 10px; background: #0284c7; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .btn:hover { background: #0369a1; }
        .btn-green { background: #16a34a; }
        .btn-green:hover { background: #15803d; }
    </style>
</head>
<body>
    <div class="box">
        <h1>نام نرم‌افزار شما</h1>
        <p>توضیح کوتاه و جذاب درباره اینکه نرم‌افزار شما چه کاری انجام می‌دهد و چه مشکلی را حل می‌کند.</p>
        
        <br>
        <a href="#" class="btn">📥 دانلود نرم‌افزار</a>
        <a href="#" class="btn btn-green">🔑 خرید لایسنس / ارتباط با ما</a>

        <br><br>
        <p style="font-size: 13px; color: #94a3b8;">طراحی شده برای مهندسین و متخصصان</p>
    </div>
</body>
</html>
